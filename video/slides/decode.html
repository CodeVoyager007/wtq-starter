<!doctype html>
<html><head><meta charset="utf-8"><title>Decode Sequence</title>
<link rel="stylesheet" href="common.css">
<style>
  #head { position: absolute; left: 80px; top: 48px; display: flex; align-items: baseline; gap: 28px; }
  #head h1 { margin: 0; font: 64px Anton; letter-spacing: 3px; text-transform: uppercase; }
  #view { position: absolute; left: 80px; top: 150px; width: 900px; height: 870px; overflow: hidden; border-radius: 14px;
          background: #111; box-shadow: 0 0 0 2px rgba(255,122,26,.35), 0 30px 80px rgba(0,0,0,.6); }
  #cam { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #cam img { display: block; }
  #box { position: absolute; border: 5px solid var(--orange); border-radius: 6px;
         box-shadow: 0 0 0 4000px rgba(0,0,0,.45), 0 0 30px var(--orange), inset 0 0 20px rgba(255,122,26,.4); }
  #json { position: absolute; left: 1040px; top: 150px; width: 800px; height: 870px; border-radius: 14px; overflow: hidden;
          background: #0c0a09; box-shadow: 0 0 0 2px rgba(255,255,255,.06); padding: 26px 34px; box-sizing: border-box;
          font: 500 24px/1.36 JBMono, monospace; color: #5d564f; }
  .ln { white-space: pre; border-radius: 4px; padding: 0 8px; margin: 0 -8px; }
  .ln.on { color: var(--cream); }
  .ln.act { background: rgba(255,122,26,.16); color: #fff; box-shadow: inset 5px 0 0 var(--orange); }
  .ln.on .k { color: var(--amber); }
  .v { opacity: 0; } .ln.on .v { opacity: 1; }
  .ln.on .num { color: #8fd3ff; } .ln.on .str { color: #b6f09c; } .ln.on .nul { color: #ff8b8b; }
  .sub { font-size: 20px; }
  #tag { position: absolute; right: 80px; top: 64px; font: 30px Bebas; letter-spacing: 8px; color: var(--dim); }
</style></head>
<body><div id="stage">
  <div class="layer glow"></div>
  <div id="head"><span class="kicker">LEVEL 1</span><h1>Bill → JSON</h1></div>
  <div id="tag"></div>
  <div id="view"><div id="cam"><img id="bill"><div id="box"></div></div></div>
  <div id="json"><div id="jin"></div></div>
  <div class="layer vignette"></div>
  <canvas id="grain" class="layer grain" width="480" height="270"></canvas>
</div>
<script src="common.js"></script>
<script>
// Data-driven: data/level1.json (the CLI's real output) + data/boxes.json (where each field sits on the bill).
const STEP = 0.72, LEAD = 0.9, VW = 900, VH = 870;
const BILL = params.get('bill') || 'KESC_0008';
let steps = [], boxes = {}, lines = [], IW = 1446, IH = 2046;
const fmt = v => v === null ? `<span class="nul">null</span>` : typeof v === 'number' ? `<span class="num">${v}</span>` : `<span class="str">"${v}"</span>`;
window.DUR = 20;
window.assetsReady = Promise.all([loadJSON('data/level1.json'), loadJSON('data/boxes.json'), loadImages([`../assets/${BILL}.png`])])
.then(([data, bx]) => {
  boxes = bx; $('bill').src = `../assets/${BILL}.png`;
  IW = $('bill').naturalWidth || IW; IH = $('bill').naturalHeight || IH;
  $('tag').textContent = `${BILL} · ${data.provider}`;
  let html = '<div class="ln on">{</div>';
  for (const [k, v] of Object.entries(data)) {
    if (k.startsWith('_')) continue;
    const idx = steps.length; steps.push(k);
    if (Array.isArray(v)) {
      html += `<div class="ln" data-s="${idx}">  <span class="k">"${k}"</span>: <span class="v">[</span></div>`;
      v.forEach(it => html += `<div class="ln sub" data-s="${idx}">    <span class="v">{ "type": ${fmt(it.type)}, "amount": ${fmt(it.amount)} }</span></div>`);
      html += `<div class="ln" data-s="${idx}">  <span class="v">],</span></div>`;
    } else html += `<div class="ln" data-s="${idx}">  <span class="k">"${k}"</span>: <span class="v">${fmt(v)},</span></div>`;
  }
  $('jin').innerHTML = html + '<div class="ln on">}</div>';
  lines = [...$('jin').querySelectorAll('.ln[data-s]')];
  window.DUR = LEAD + steps.length * STEP + 1.6;
  return document.fonts.ready;
}).then(() => render(0));

function cam(k) { // camera framing for step k; whole bill when no box
  if (k < 0 || !boxes[steps[k]]) { const s = VH / IH * 0.98; return { s, cx: IW / 2, cy: IH / 2 }; }
  const [x0, y0, x1, y1] = boxes[steps[k]];
  const s = clamp(Math.min(VW * 0.62 / (x1 - x0), VH * 0.4 / (y1 - y0)), 0.9, 2.6);
  return { s, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2 };
}
window.render = t => {
  const raw = (t - LEAD) / STEP, k = Math.floor(raw), f = raw - k;
  const end = t > LEAD + steps.length * STEP;
  const cur = end ? -1 : Math.min(k, steps.length - 1);
  const a = cam(end ? steps.length - 1 : k - 1), b = cam(cur);
  const m = easeIO(end ? (t - LEAD - steps.length * STEP) / 0.8 : f / 0.55);
  const s = lerp(a.s, b.s, m), cx = lerp(a.cx, b.cx, m), cy = lerp(a.cy, b.cy, m);
  $('cam').style.transform = `translate(${VW / 2 - cx * s}px, ${VH / 2 - cy * s}px) scale(${s})`;
  const bx = cur >= 0 && boxes[steps[cur]];
  $('box').style.opacity = bx ? ease((f - 0.35) / 0.2) : 0;
  if (bx) Object.assign($('box').style, { left: bx[0] - 5 + 'px', top: bx[1] - 3 + 'px',
    width: bx[2] - bx[0] + 10 + 'px', height: bx[3] - bx[1] + 6 + 'px' });
  if (bx) $('box').style.borderWidth = `${clamp(4 / s * 1.6, 2, 6)}px`;
  for (const el of lines) {
    const si = Number(el.dataset.s), live = si === k && f > 0.45;
    el.classList.toggle('on', end || si < k || live); el.classList.toggle('act', !end && live);
  }
  // Keep the active line in view
  const tgt = lines.filter(l => Number(l.dataset.s) === Math.min(Math.max(k, 0), steps.length - 1)).pop();
  const maxScroll = Math.max(0, $('jin').scrollHeight - 818);
  const want = end ? maxScroll : tgt ? clamp(tgt.offsetTop - 818 * 0.6, 0, maxScroll) : 0;
  window._scroll = window._scroll === undefined ? want : lerp(window._scroll, want, 0.18);
  $('jin').style.transform = `translateY(${-window._scroll}px)`;
  $('head').style.opacity = ease(t / 0.5);
  $('stage').style.opacity = 1 - clamp((t - window.DUR + 0.4) / 0.4);
  grain($('grain'), t);
};
</script></body></html>
