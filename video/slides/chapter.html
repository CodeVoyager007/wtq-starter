<!doctype html>
<html><head><meta charset="utf-8"><title>Chapter Card</title>
<link rel="stylesheet" href="common.css">
<style>
  #plateWrap { position: absolute; inset: 0; overflow: hidden; }
  #shade { background: linear-gradient(90deg, rgba(5,5,5,.92) 0%, rgba(5,5,5,.55) 55%, rgba(5,5,5,.85) 100%); }
  #block { position: absolute; left: 240px; top: 50%; transform: translateY(-50%); }
  #lbl { margin-bottom: 34px; }
  #mask { overflow: hidden; padding-bottom: 6px; }
  #title { font: 150px/0.95 Anton; letter-spacing: 10px; text-transform: uppercase; color: var(--cream); }
  #rule { height: 2px; background: var(--orange); margin: 34px 0 30px; width: 0; }
  #sub { font: 300 38px var(--text); letter-spacing: 1px; color: #cfc4b8; }
</style></head>
<body><div id="stage">
  <div id="plateWrap"><div id="plate" class="plate"></div></div>
  <div id="shade" class="layer"></div>
  <div id="block">
    <div class="label" id="lbl"></div>
    <div id="mask"><div id="title"></div></div>
    <div id="rule"></div>
    <div id="sub"></div>
  </div>
  <div class="layer vignette"></div>
  <canvas id="grain" class="layer grain" width="480" height="270"></canvas>
  <div class="lb t"></div><div class="lb b"></div>
</div>
<script src="common.js"></script>
<script>
window.DUR = 3.0;
const PLATES = ['logo_raw', 'calc_raw', 'usage_raw', 'history_raw'];
const idx = Number(params.get('i') || 0);
window.assetsReady = loadJSON('data/project.json').then(p => {
  const c = p.chapters[idx];
  $('lbl').innerHTML = `Chapter <b>${c.num}</b> / ${String(p.chapters.length).padStart(2, '0')}`;
  $('title').textContent = c.title; $('sub').textContent = c.sub;
  $('plate').style.backgroundImage = `url(../assets/panels/${PLATES[idx % PLATES.length]}.jpg)`;
  return loadImages([`../assets/panels/${PLATES[idx % PLATES.length]}.jpg`]);
}).then(() => render(0));
window.render = t => {
  // Depth plate: slow push and drift for the whole shot
  $('plate').style.transform = `scale(${lerp(1.0, 1.08, t / 3)}) translateX(${lerp(0, -40, t / 3)}px)`;
  const out = 1 - clamp((t - 2.6) / 0.4);
  $('lbl').style.opacity = easeS((t - 0.15) / 0.6) * out;
  const k = easeS((t - 0.3) / 0.9);
  $('title').style.transform = `translateY(${lerp(110, 0, k)}%)`;
  $('title').style.opacity = out;
  $('rule').style.width = `${260 * easeS((t - 0.8) / 0.9)}px`; $('rule').style.opacity = out;
  $('sub').style.opacity = easeS((t - 1.0) / 0.7) * out;
  $('sub').style.transform = `translateY(${lerp(12, 0, easeS((t - 1.0) / 0.7))}px)`;
  $('stage').style.opacity = easeS(t / 0.4);
  grain($('grain'), t);
};
</script></body></html>
