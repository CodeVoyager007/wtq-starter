<!doctype html>
<html><head><meta charset="utf-8"><title>Chapter Card</title>
<link rel="stylesheet" href="common.css">
<style>
  #bgnum { position: absolute; right: -60px; top: -140px; font: 1300px/1 Anton; color: rgba(255,122,26,.045); }
  #wrap { display: flex; align-items: center; padding-left: 220px; gap: 70px; }
  #num { font: 420px/0.8 Anton; color: transparent; -webkit-text-stroke: 4px var(--orange); position: relative; }
  #numFill { position: absolute; inset: 0; color: var(--orange); -webkit-text-stroke: 0; clip-path: inset(100% 0 0 0);
             text-shadow: 0 0 40px rgba(255,122,26,.5); }
  #txt { display: flex; flex-direction: column; gap: 10px; }
  #titleBox { position: relative; }
  .title { font: 200px/0.9 Anton; text-transform: uppercase; letter-spacing: 4px; color: var(--cream); }
  .slice { position: absolute; left: 0; top: 0; }
  #sub { font: 52px Bebas; letter-spacing: 10px; color: var(--amber); }
  #bar { position: absolute; left: 220px; bottom: 220px; height: 6px; background: linear-gradient(90deg, var(--ember), var(--orange)); box-shadow: 0 0 24px var(--orange); }
</style></head>
<body><div id="stage">
  <div class="layer glow"></div>
  <div id="bgnum"></div>
  <canvas id="emb" class="layer embers" width="1920" height="1080"></canvas>
  <div id="wrap" class="layer">
    <div id="num"><span id="n"></span><span id="numFill"></span></div>
    <div id="txt"><div class="kicker" id="kick">CHAPTER</div>
      <div id="titleBox"><div class="title" id="title"></div></div>
      <div id="sub"></div></div>
  </div>
  <div id="bar"></div><div class="sweep" id="sw"></div>
  <div class="layer vignette"></div>
  <canvas id="grain" class="layer grain" width="480" height="270"></canvas>
</div>
<script src="common.js"></script>
<script>
window.DUR = 2.8;
const SL = 7; let slices = [];
window.assetsReady = loadJSON('data/project.json').then(p => {
  const c = p.chapters[Number(params.get('i') || 0)];
  $('n').textContent = c.num; $('numFill').textContent = c.num; $('bgnum').textContent = c.num;
  $('title').textContent = c.title; $('sub').textContent = c.sub;
  for (let i = 0; i < SL; i++) { // glitch slices of the title
    const d = document.createElement('div'); d.className = 'title slice'; d.textContent = c.title;
    d.style.clipPath = `inset(${i * 100 / SL}% 0 ${100 - (i + 1) * 100 / SL}% 0)`;
    $('titleBox').appendChild(d); slices.push(d);
  }
  return document.fonts.ready;
}).then(() => render(0));
window.render = t => {
  const out = 1 - clamp((t - 2.45) / 0.35);
  $('num').style.transform = `translateX(${lerp(-120, 0, ease(t / 0.6))}px) scale(${lerp(1.2, 1, ease(t / 0.6))})`;
  $('num').style.opacity = ease(t / 0.3) * out;
  $('numFill').style.clipPath = `inset(${100 - 100 * easeIO((t - 0.25) / 0.7)}% 0 0 0)`;
  $('bgnum').style.transform = `translateX(${lerp(80, -40, t / 2.8)}px)`;
  // Glitch-slice reveal: slices fly in from alternating sides, real title takes over once settled
  const gk = (t - 0.15) / 0.55;
  slices.forEach((el, i) => {
    const k = ease(gk - i * 0.05), dir = i % 2 ? 1 : -1;
    el.style.transform = `translateX(${dir * lerp(260, 0, k) + (k < 1 ? Math.sin(t * 80 + i) * 8 * (1 - k) : 0)}px)`;
    el.style.opacity = clamp(gk * 3) * (gk < 1.1 ? 1 : 0) * out;
    el.style.color = i % 3 === 0 && k < 0.9 ? 'var(--orange)' : 'var(--cream)';
  });
  $('title').style.opacity = gk >= 1.1 ? out : 0;
  $('sub').style.opacity = ease((t - 0.55) / 0.4) * out; $('kick').style.opacity = ease((t - 0.4) / 0.4) * out;
  $('sub').style.letterSpacing = `${lerp(26, 10, ease((t - 0.55) / 1))}px`;
  $('bar').style.width = `${1480 * easeIO(t / 2.4)}px`; $('bar').style.opacity = out;
  sweep($('sw'), (t - 0.2) / 1.0);
  embers($('emb'), t + 3, 60, out);
  grain($('grain'), t);
};
</script></body></html>
