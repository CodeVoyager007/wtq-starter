<!doctype html>
<html><head><meta charset="utf-8"><title>Answers Sequence</title>
<link rel="stylesheet" href="common.css">
<style>
  #head { position: absolute; left: 100px; top: 60px; display: flex; align-items: baseline; gap: 28px; }
  #head h1 { margin: 0; font: 54px Anton; letter-spacing: 8px; text-transform: uppercase; color: var(--cream); }
  #count { position: absolute; right: 100px; top: 76px; font: 500 20px JBMono, monospace; letter-spacing: 5px; color: var(--dim); }
  #count b { color: var(--orange); font-weight: normal; }
  #card { position: absolute; left: 100px; width: 1080px; top: 180px; }
  #q { font: 300 62px/1.15 var(--text); color: var(--cream); display: flex; flex-direction: column; gap: 22px; letter-spacing: -0.5px; }
  #qbadge { font: 500 20px JBMono, monospace; letter-spacing: 5px; color: var(--orange); }
  #qtxt span { display: inline-block; white-space: pre; }
  #calc { display: inline-flex; gap: 18px; align-items: center; margin-top: 40px; padding: 16px 26px; border-radius: 10px;
          background: transparent; box-shadow: inset 0 0 0 1px rgba(255,122,26,.5);
          font: 600 30px JBMono, monospace; color: #8fd3ff; position: relative; overflow: hidden; }
  #calc span { font: 500 18px JBMono, monospace; letter-spacing: 5px; color: var(--dim); }
  #calcShine { position: absolute; top: 0; bottom: 0; width: 120px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.25), transparent); }
  #a { margin-top: 40px; font: 400 32px/1.55 JBMono, monospace; color: var(--cream);
       border-left: 2px solid var(--orange); padding-left: 30px; min-height: 260px; color: #e6dccf; }
  #a .cur { display: inline-block; width: 14px; height: 30px; background: var(--orange); vertical-align: -5px; margin-left: 4px; }
  #grounded { margin-top: 26px; font: 500 18px JBMono, monospace; letter-spacing: 5px; color: var(--dim); text-transform: uppercase; }
  #srcWrap { position: absolute; left: 1260px; top: 180px; width: 560px; }
  #srcLbl { font: 500 18px JBMono, monospace; letter-spacing: 5px; color: var(--dim); margin-bottom: 16px; }
  #view { position: relative; width: 560px; height: 700px; overflow: hidden; border-radius: 14px; background: #111;
          box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 40px 100px rgba(0,0,0,.7); }
  #cam { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #cam img { display: block; }
  #box { position: absolute; border: 3px solid var(--orange); border-radius: 4px; box-shadow: 0 0 0 4000px rgba(0,0,0,.55); }
</style></head>
<body><div id="stage">
  <div class="layer" style="background: radial-gradient(ellipse at 30% 40%, #14110e, #050505 70%)"></div>
  <div id="head"><span class="label">Level <b>2</b></span><h1>Ask the bill</h1></div>
  <div id="count"></div>
  <div id="card">
    <div id="q"><div id="qbadge"></div><div id="qtxt"></div></div>
    <div id="calc"><span>COMPUTED</span><div id="calcTxt"></div></div>
    <div id="a"></div>
    <div id="grounded"></div>
  </div>
  <div id="srcWrap"><div id="srcLbl">SOURCE ON THE BILL</div>
    <div id="view"><div id="cam"><img id="bill"><div id="box"></div></div></div></div>
  <div class="layer vignette"></div>
  <canvas id="grain" class="layer grain" width="480" height="270"></canvas>
</div>
<script src="common.js"></script>
<script>
// Data-driven: data/level2.json items {q, calc, a, source:[x0,y0,x1,y1] on the bill image}.
const CPS = 55, VW = 560, VH = 700, BILL = params.get('bill') || 'KESC_0008';
let items = [], slots = [], IW = 1446, IH = 2046, lastQ = -1;
window.DUR = 20;
window.assetsReady = Promise.all([loadJSON('data/level2.json'), loadImages([`../assets/${BILL}.png`])]).then(([d]) => {
  $('bill').src = `../assets/${BILL}.png`; IW = $('bill').naturalWidth || IW; IH = $('bill').naturalHeight || IH;
  items = d.items; $('grounded').textContent = d.badge || '✓ Grounded in the bill'; let t = 0;
  for (const it of items) { const len = 1.8 + it.a.length / CPS + 2.2; slots.push({ s: t, len }); t += len; }
  window.DUR = t; return document.fonts.ready;
}).then(() => render(0));
function cam(b) {
  if (!b) { const s = VH / IH; return { s, cx: IW / 2, cy: IH / 2 }; }
  const s = clamp(Math.min(VW * 0.85 / (b[2] - b[0]), VH * 0.5 / (b[3] - b[1])), 0.3, 2.2);
  return { s, cx: (b[0] + b[2]) / 2, cy: (b[1] + b[3]) / 2 };
}
window.render = t => {
  let i = slots.findIndex(s => t >= s.s && t < s.s + s.len); if (i < 0) i = items.length - 1;
  const it = items[i], lt = t - slots[i].s, len = slots[i].len;
  const out = 1 - clamp((lt - len + 0.35) / 0.35);
  $('card').style.opacity = out;
  if (lastQ !== i) { // split question into words once per item
    $('qtxt').innerHTML = it.q.split(' ').map(w => `<span>${w} </span>`).join(''); lastQ = i;
    $('calcTxt').textContent = it.calc;
  }
  [...$('qtxt').children].forEach((w, j) => {
    const k = easeS((lt - 0.15 - j * 0.06) / 0.7);
    w.style.opacity = k; w.style.transform = `translateY(${lerp(14, 0, k)}px)`;
  });
  $('qbadge').textContent = `Question ${String(i + 1).padStart(2, '0')}`; $('qbadge').style.opacity = easeS(lt / 0.5);
  const ck = easeS((lt - 0.9) / 0.7);
  $('calc').style.opacity = ck; $('calc').style.transform = `translateY(${lerp(10, 0, ck)}px)`;
  const n = Math.floor(clamp((lt - 1.6) * CPS, 0, it.a.length));
  const typing = n < it.a.length && lt > 1.6;
  $('a').innerHTML = it.a.slice(0, n).replace(/&/g, '&amp;').replace(/</g, '&lt;') +
    (typing || Math.floor(lt * 2) % 2 ? '<span class="cur"></span>' : '');
  $('grounded').style.opacity = ease((lt - 1.6 - it.a.length / CPS - 0.1) / 0.4);
  // Source panel: fly from the whole bill to this answer's region
  const a = cam(null), b = cam(it.source), m = easeS((lt - 0.4) / 1.6);
  const s = lerp(a.s, b.s, m), cx = lerp(a.cx, b.cx, m), cy = lerp(a.cy, b.cy, m);
  $('cam').style.transform = `translate(${VW / 2 - cx * s}px, ${VH / 2 - cy * s}px) scale(${s})`;
  const bx = it.source;
  $('box').style.opacity = bx ? easeS((lt - 1.7) / 0.6) : 0;
  if (bx) Object.assign($('box').style, { left: bx[0] - 6 + 'px', top: bx[1] - 4 + 'px', width: bx[2] - bx[0] + 12 + 'px',
    height: bx[3] - bx[1] + 8 + 'px', borderWidth: `${clamp(4 / s, 3, 10)}px` });
  $('srcWrap').style.opacity = ease(t / 0.6) * (i === items.length - 1 ? out : 1);
  $('count').textContent = `${String(i + 1).padStart(2, '0')} / ${String(items.length).padStart(2, '0')}`;
  $('head').style.opacity = ease(t / 0.5);
  grain($('grain'), t);
};
</script></body></html>
