<!doctype html>
<html><head><meta charset="utf-8"><title>Outro Card</title>
<link rel="stylesheet" href="common.css">
<style>
  #plateWrap { position: absolute; inset: 0; overflow: hidden; }
  #shade { background: radial-gradient(ellipse at center, rgba(5,5,5,.6), rgba(5,5,5,.95) 75%); }
  .rib { position: absolute; top: -10%; height: 120%; mix-blend-mode: screen; border-radius: 40%; }
  #wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #name { font: 120px Anton; letter-spacing: 14px; text-transform: uppercase; color: var(--cream); }
  #rule { height: 2px; width: 0; background: var(--orange); margin: 26px 0 30px; }
  #stats { display: flex; gap: 110px; margin-bottom: 64px; }
  .stat { text-align: center; }
  .stat .v { font: 200 120px/1 var(--text); color: var(--cream); letter-spacing: -2px; font-variant-numeric: tabular-nums; }
  .stat .l { margin-top: 14px; }
  #by { font: 300 34px var(--text); color: #cfc4b8; letter-spacing: 1px; }
  #meta { margin-top: 22px; }
</style></head>
<body><div id="stage">
  <div id="plateWrap"><div id="plate" class="plate" style="background-image:url(../assets/panels/calc_raw.jpg)"></div></div>
  <div id="shade" class="layer"></div>
  <div id="ribs" class="layer"></div>
  <div id="wrap" class="layer">
    <div id="stats"></div>
    <div id="name"></div><div id="rule"></div>
    <div id="by"></div><div class="label" id="meta"></div>
  </div>
  <div class="layer vignette"></div>
  <canvas id="grain" class="layer grain" width="480" height="270"></canvas>
  <div class="lb t"></div><div class="lb b"></div>
</div>
<script src="common.js"></script>
<script>
window.DUR = 6;
let stats = [];
// Brief Netflix-style ribbon callback to the intro
const ribs = []; { let sd = 5; const r = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
  const pal = ['#ff7a1a', '#e8401c', '#ffb340', '#ffd29a'];
  for (let i = 0; i < 30; i++) { const el = document.createElement('div'); el.className = 'rib'; const c = pal[i % 4];
    el.style.background = `linear-gradient(180deg, transparent, ${c} 30%, ${c} 70%, transparent)`;
    document.getElementById('ribs').appendChild(el); ribs.push({ el, x: r(), w: 2 + Math.pow(r(), 2) * 34 }); } }
window.assetsReady = Promise.all([loadJSON('data/project.json'), loadImages(['../assets/panels/calc_raw.jpg'])]).then(([p]) => {
  $('stats').innerHTML = p.stats.map(s => `<div class="stat"><div class="v" data-v="${s.value}">0</div><div class="label l">${s.label}</div></div>`).join('');
  stats = [...document.querySelectorAll('.stat')];
  $('name').textContent = p.name; $('by').textContent = `${p.author} · ${p.event}`;
  $('meta').innerHTML = `Model <b>${p.model}</b>`;
  return document.fonts.ready;
}).then(() => render(0));
window.render = t => {
  $('plate').style.transform = `scale(${lerp(1.0, 1.07, t / 6)})`;
  const rk = clamp(t / 1.0);
  for (const r of ribs) { r.el.style.left = `${lerp(960, r.x * 1920, easeS(rk)) - r.w / 2}px`; r.el.style.width = `${r.w}px`;
    r.el.style.opacity = rk < 1 ? 0.75 * Math.sin(rk * Math.PI) : 0; }
  $('ribs').style.transform = `scale(${lerp(1, 2.2, easeIn(rk))})`;
  stats.forEach((el, i) => {
    const k = easeS((t - 0.9 - i * 0.2) / 1.4), v = el.querySelector('.v'), target = Number(v.dataset.v);
    v.textContent = isNaN(target) ? v.dataset.v : Math.round(target * k);
    el.style.opacity = easeS((t - 0.9 - i * 0.2) / 0.8);
    el.style.transform = `translateY(${lerp(16, 0, k)}px)`;
  });
  $('name').style.opacity = easeS((t - 2.0) / 0.9);
  $('name').style.letterSpacing = `${lerp(24, 14, easeS((t - 2.0) / 2.5))}px`;
  $('rule').style.width = `${200 * easeS((t - 2.4) / 1.0)}px`;
  $('by').style.opacity = easeS((t - 2.7) / 0.8); $('meta').style.opacity = easeS((t - 3.0) / 0.8);
  $('stage').style.opacity = 1 - clamp((t - 5.2) / 0.8);
  grain($('grain'), t);
};
</script></body></html>
