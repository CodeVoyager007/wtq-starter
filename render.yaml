# Render blueprint for the backend. In Render: New > Blueprint > pick this repo.
# (Or create a Web Service by hand with the same settings.)
services:
  - type: web
    name: wtq-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: API_KEY
        sync: false # you type the value in the Render dashboard
      - key: API_KEY_BACKUP
        sync: false
      - key: MODEL_NAME
        value: gemini-3.5-flash-lite
      - key: FRONTEND_ORIGINS
        sync: false # your Vercel URL, e.g. https://my-app.vercel.app (vercel.app links are also allowed automatically)
