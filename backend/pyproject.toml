[project]
name = "bill-decoder"
version = "1.0.0"
description = "Reads Pakistani electricity bills (K-Electric, LESCO, IESCO) and explains them in plain English."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.25.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI's File(...) / Form(...) defaults are the framework's idiom

[tool.ruff.lint.per-file-ignores]
"bill_decoder/prompts.py" = ["E501"]  # prompt text reads better unwrapped
"tests/*" = ["E501"]
